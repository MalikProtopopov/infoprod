global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: infobizbot

scrape_configs:
  # Сам Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Backend /metrics — внутри docker-сети
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8000']
        labels:
          app: backend
