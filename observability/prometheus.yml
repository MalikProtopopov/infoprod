global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: infobizbot

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Сам Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Backend /metrics — внутри docker-сети
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8000']
        labels:
          app: backend

  # Alertmanager собственные метрики
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
