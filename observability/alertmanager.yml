global:
  resolve_timeout: 5m

# Routing tree
route:
  receiver: default
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers:
        - severity = critical
      receiver: critical
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: default
    # По умолчанию — webhook на ничто (можно подменить через GRAFANA_OR_SLACK_WEBHOOK).
    webhook_configs:
      - url: 'http://grafana:3000/api/alertmanager/api/v1/alerts'
        send_resolved: true

  - name: critical
    # Критичные — туда же, но можно отдельно (email / Telegram / Slack)
    webhook_configs:
      - url: 'http://grafana:3000/api/alertmanager/api/v1/alerts'
        send_resolved: true

# Inhibit: если backend down — не шумим про error rate
inhibit_rules:
  - source_matchers:
      - alertname = BackendDown
    target_matchers:
      - service = backend
    equal: ['service']
