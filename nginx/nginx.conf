user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    log_format json_combined escape=json
      '{'
        '"ts":"$time_iso8601",'
        '"service":"nginx",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"duration_ms":$request_time,'
        '"upstream_ms":"$upstream_response_time",'
        '"user_agent":"$http_user_agent",'
        '"referer":"$http_referer"'
      '}';

    access_log /var/log/nginx/access.log json_combined;

    upstream backend  { server backend:8000; }
    upstream admin    { server admin:3000;  }

    # ------- HTTP: ACME-challenge + редирект на HTTPS -------
    server {
        listen 80;
        listen [::]:80;
        server_name grammy.mediann.dev api.grammy.mediann.dev;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location = /healthz { proxy_pass http://backend/api/healthz; }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------- HTTPS: фронт-домен. Админка + /api proxy для same-origin запросов -------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name grammy.mediann.dev;

        ssl_certificate     /etc/letsencrypt/live/grammy.mediann.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/grammy.mediann.dev/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;

        # Admin → API через same-origin (куки и CORS не нужны)
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://admin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ------- HTTPS: чистый API-домен. Префикс /api убирается. -------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.grammy.mediann.dev;

        ssl_certificate     /etc/letsencrypt/live/api.grammy.mediann.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.grammy.mediann.dev/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;

        # Префикс /api в FastAPI скрыт — внешним клиентам доступно
        # https://api.grammy.mediann.dev/auth/login → backend /api/auth/login
        location / {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
        }
    }

    # ------- Дефолт (по IP / неизвестное имя) — закрываем -------
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        return 444;
    }
}
